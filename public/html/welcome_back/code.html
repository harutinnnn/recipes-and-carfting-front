</div>
</div>
<!-- Password Field -->

</div>
<div class="relative group">

</div>
</div>

<div class="h-0.5 bg-outline-variant flex-1 opacity-40"></div>
<span class="font-label-bold text-label-bold text-outline-variant">OR</span>

<!-- Micro-interaction Script -->
<script>
        const loginBtn = document.getElementById('loginBtn');
        
        loginBtn.addEventListener('mousedown', () => {
            loginBtn.classList.add('pressed');
        });
        
        loginBtn.addEventListener('mouseup', () => {
            loginBtn.classList.remove('pressed');
        });
        
        loginBtn.addEventListener('mouseleave', () => {
            loginBtn.classList.remove('pressed');
        });

        // Add small hover float effect to the main icon
        const farmIcon = document.querySelector('.bg-primary');
        let hoverY = 0;
        let direction = 1;
        
        function animateIcon() {
            hoverY += 0.05 * direction;
            if (Math.abs(hoverY) > 2) direction *= -1;
            farmIcon.style.transform = `translateY(${hoverY}px)`;
            requestAnimationFrame(animateIcon);
        }
        animateIcon();
    </script>
