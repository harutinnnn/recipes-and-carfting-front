<script>
        // Simple micro-interaction for buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                btn.classList.add('pressed');
            });
            btn.addEventListener('touchend', () => {
                btn.classList.remove('pressed');
            });
            btn.addEventListener('mousedown', () => {
                btn.classList.add('pressed');
            });
            btn.addEventListener('mouseup', () => {
                btn.classList.remove('pressed');
            });
        });

        // "Water All" Visual Feedback
        document.getElementById('water-all').addEventListener('click', () => {
            const plots = document.querySelectorAll('.aspect-square.bg-surface-container');
            plots.forEach((plot, index) => {
                setTimeout(() => {
                    const ripple = document.createElement('div');
                    ripple.className = 'absolute inset-0 bg-blue-300 opacity-40 rounded-xl transition-all duration-500 scale-0';
                    plot.appendChild(ripple);
                    requestAnimationFrame(() => {
                        ripple.classList.remove('scale-0');
                        ripple.classList.add('scale-100');
                        setTimeout(() => ripple.remove(), 600);
                    });
                }, index * 100);
            });
        });
    </script>
