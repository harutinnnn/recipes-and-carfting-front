<body class="bg-surface font-body-md text-on-surface min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop overflow-x-hidden relative">
<!-- Atmospheric Background Elements -->

</div>
<form class="space-y-md px-sm md:px-lg pb-md" id="registrationForm">
<!-- Avatar Picker -->
<div class="flex flex-col items-center justify-center gap-base">
<div class="relative group cursor-pointer">
<div class="w-32 h-32 rounded-full border-4 border-dashed border-outline-variant bg-surface-container flex items-center justify-center overflow-hidden transition-all group-hover:border-primary">

<span class="material-symbols-outlined text-outline-variant text-5xl group-hover:text-primary transition-colors" id="avatarPlaceholder">add_a_photo</span>
</div>
<input accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" id="avatarInput" type="file"/>
<div class="absolute -bottom-1 -right-1 bg-primary text-on-primary p-xs rounded-full border-2 border-surface-container-lowest shadow-sm">
<span class="material-symbols-outlined text-sm">edit</span>
</div>
</div>
<label class="font-label-bold text-on-surface-variant">Choose Your Farmer</label>
</div>
<div class="grid grid-cols-1 gap-base">
<!-- Full Name -->
<div>
<label class="block font-label-bold text-on-surface mb-xs ml-xs" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">person</span>
<input class="w-full pl-12 pr-4 py-4 rounded-xl bg-surface-container border-2 border-transparent focus:border-primary focus:ring-0 transition-all font-body-md custom-inset-shadow" id="fullName" placeholder="Sam Gardener" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div>
<label class="block font-label-bold text-on-surface mb-xs ml-xs" for="email">Email Address</label>

<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
<input class="w-full pl-12 pr-4 py-4 rounded-xl bg-surface-container border-2 border-transparent focus:border-primary focus:ring-0 transition-all font-body-md custom-inset-shadow" id="email" placeholder="sam@harvest.com" required="" type="email"/>
</div>
</div>
<!-- Gender -->

</label>

</label>

<input checked="" class="hidden peer" name="gender" type="radio" value="other"/>

<path d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" fill="#34A853"></path>
<path d="M0 0h48v48H0z" fill="none"></path>
</svg>
                Continue with Google
            </button>
<!-- Footer Link -->
<p class="text-center font-label-bold text-on-surface-variant pt-sm">
                Already have a farm? 
                <a class="text-secondary hover:underline ml-xs" href="#">Log In</a>
</p>

</main>
<!-- Success Modal Overlay (Hidden by default) -->
<div class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-sm z-50 flex items-center justify-center p-md hidden" id="successModal">
<div class="bg-surface-container-lowest rounded-[32px] border-4 border-primary p-lg max-w-sm w-full text-center shadow-2xl scale-95 transition-transform duration-300" id="modalContent">
<div class="w-20 h-20 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center mx-auto mb-md">
<span class="material-symbols-outlined text-5xl">task_alt</span>
</div>
<h2 class="font-headline-lg text-primary mb-xs">Welcome Home!</h2>
<p class="font-body-md text-on-surface mb-lg">Your plot of land is ready for planting, Sam.</p>
<button class="w-full py-4 bg-primary text-on-primary rounded-xl font-headline-lg-mobile btn-primary-press" onclick="closeModal()">
                Start Harvesting
            </button>
</div>
</div>
<script>
        // Handle Avatar Preview
        const avatarInput = document.getElementById('avatarInput');
        const avatarPreview = document.getElementById('avatarPreview');
        const avatarPlaceholder = document.getElementById('avatarPlaceholder');

        avatarInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    avatarPreview.src = e.target.result;
                    avatarPreview.classList.remove('hidden');
                    avatarPlaceholder.classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        });

        // Handle Form Submission
        const form = document.getElementById('registrationForm');
        const modal = document.getElementById('successModal');
        const modalContent = document.getElementById('modalContent');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Show modal with animation
            modal.classList.remove('hidden');
            setTimeout(() => {
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);

            // Confetti effect (Simple atmospheric)
            for(let i=0; i<30; i++) {
                createConfetti();
            }
        });

        function closeModal() {
            modal.classList.add('hidden');
            modalContent.classList.add('scale-95');
        }

        function createConfetti() {
            const confetti = document.createElement('div');
            const colors = ['#006e2f', '#4ae176', '#944a23', '#fd9e70', '#ffe083'];
            confetti.style.position = 'fixed';
            confetti.style.width = '8px';
            confetti.style.height = '8px';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.top = '-10px';
            confetti.style.borderRadius = '2px';
            confetti.style.zIndex = '100';
            confetti.style.pointerEvents = 'none';
            document.body.appendChild(confetti);

            const animation = confetti.animate([
                { transform: `translateY(0) rotate(0deg)`, opacity: 1 },
                { transform: `translateY(100vh) rotate(${Math.random() * 360}deg)`, opacity: 0 }
            ], {
                duration: 2000 + Math.random() * 3000,
                easing: 'cubic-bezier(0, .9, .57, 1)'
            });

            animation.onfinish = () => confetti.remove();
        }

        // Add subtle focus interaction on the inputs
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('scale-[1.02]');
                input.parentElement.parentElement.style.transition = 'transform 0.2s ease';
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('scale-[1.02]');
            });
        });
    </script>
